<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Danu SPA - Administración</title>

    <meta
        name="robots"
        content="noindex,nofollow"
    >

    <link
        rel="stylesheet"
        href="admin.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

</head>

<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="admin-header">

        <a
            href="index.html"
            class="brand"
        >
            ✦ Danu <i>SPA</i>
        </a>

        <div class="header-actions">

            <a
                href="index.html"
                class="back-button"
            >
                ← Ver página
            </a>

            <button
                id="logout"
                class="logout-button hidden"
                type="button"
            >
                Cerrar sesión
            </button>

        </div>

    </header>


    <!-- =====================================================
         CONTENIDO
    ====================================================== -->

    <main
        id="adminApp"
        class="admin-main"
    >

        <div class="loading-screen">

            <div class="loader"></div>

            <p>
                Cargando administración...
            </p>

        </div>

    </main>


    <!-- =====================================================
         CONFIG
    ====================================================== -->

    <script src="config.js"></script>

    <!-- =====================================================
         ADMIN JS
    ====================================================== -->

    <script src="admin.js"></script>

</body>

</html>
